# Publica o jogo no GitHub Pages a cada push na main: roda os testes, faz o build e envia a pasta dist/.
# O Pages do repositório precisa estar ligado com a origem "GitHub Actions" (Settings → Pages); o token da Action
# não tem permissão para ligá-lo.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          # O Pages às vezes fica muito tempo em "updating_pages"; o padrão de 10 min chegou a estourar.
          timeout: 1800000
