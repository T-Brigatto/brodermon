<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Brodermon — Batalha C (golpes embaixo, sem legenda, divisores)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* régua: grade de 8 px · respiro externo 12 · gap 12 · padding interno 12 · raio 12 (pequenos: 6)
     alturas: placa 56 · card 72 · pastilha 56 · tática 48
     cores: fundo #171c2c · painel #242b3d · card #2b3347 · neutro #3a4458 · degrau #0f1320
            acento #ffc14d · vida #5fd17f · perigo #ff5f6d · texto #fff · secundário #9aa5bd
     fonte: Outfit 700 nomes e botões · 600 rótulos · 500 secundário */
  html, body { margin: 0; background: #171c2c; }
  * { box-sizing: border-box; }
  .tela { width: 390px; height: 844px; overflow: hidden; background: #171c2c; color: #fff; font-family: 'Outfit', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; }
  .campo { position: relative; height: 400px; background: #1a1c2c; overflow: hidden; flex: none; }
  .campo img { position: absolute; left: 0; top: 60px; width: 390px; height: 340px; image-rendering: pixelated; display: block; }
  .hud { position: absolute; left: 12px; right: 12px; top: 12px; display: flex; gap: 12px; }
  .sp { background-repeat: no-repeat; image-rendering: pixelated; display: block; }

  .quadrado { width: 56px; height: 56px; border-radius: 12px; background: #3a4458; box-shadow: 0 4px 0 #262d3d; display: flex; align-items: center; justify-content: center; flex: none; }
  .placa { flex: 1; height: 56px; padding: 0 12px 0 8px; border-radius: 12px; background: #242b3d; box-shadow: 0 4px 0 #0f1320; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .retrato { width: 40px; height: 40px; border-radius: 8px; background: #171c2c; display: flex; align-items: center; justify-content: center; overflow: hidden; flex: none; }
  .placa .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .l1 { height: 16px; display: flex; align-items: center; justify-content: space-between; }
  .l2 { height: 12px; display: flex; align-items: center; gap: 8px; }
  .nome { font-weight: 700; font-size: 15px; line-height: 16px; letter-spacing: 0.3px; text-transform: uppercase; }
  .num { font-weight: 600; font-size: 12px; line-height: 12px; color: #9aa5bd; font-variant-numeric: tabular-nums; }
  .barra { flex: 1; height: 8px; border-radius: 4px; background: #0f1320; overflow: hidden; }
  .barra i { display: block; height: 100%; border-radius: 4px; background: #5fd17f; }
  .coracoes { display: flex; gap: 2px; height: 16px; align-items: center; }
  .coracoes svg { width: 11px; height: 11px; display: block; }

  .baixo { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 12px 24px 12px; }
  .divisor { height: 1px; background: #2b3347; }
  .bloco { display: flex; flex-direction: column; gap: 8px; }
  .rotulo { height: 12px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 11px; line-height: 12px; letter-spacing: 1px; color: #9aa5bd; text-transform: uppercase; }

  .golpes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .golpe { position: relative; height: 72px; padding: 12px; border-radius: 12px; background: #2b3347; box-shadow: 0 4px 0 #0f1320; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
  .golpe .g1 { height: 22px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .golpe .g2 { height: 18px; display: flex; align-items: center; justify-content: space-between; }
  .golpe .t { font-weight: 700; font-size: 14px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .golpe .m { font-weight: 500; font-size: 11px; line-height: 12px; color: #9aa5bd; }
  .golpe .p { font-weight: 700; font-size: 18px; line-height: 18px; color: #ffc14d; font-variant-numeric: tabular-nums; }
  .golpe .p small { font-weight: 600; font-size: 9px; letter-spacing: 1px; margin-left: 3px; color: #ffc14d; }
  .golpe .def { font-weight: 700; font-size: 11px; line-height: 18px; letter-spacing: 1px; color: #5fd17f; }
  .golpe.espera { background: #20263a; }
  .golpe.espera .t, .golpe.espera .m, .golpe.espera .p, .golpe.espera .p small { color: #5e6880; }
  .golpe.espera .selo { filter: saturate(0) brightness(0.6); }
  .golpe .tempo { position: absolute; right: 12px; top: 12px; height: 22px; display: flex; align-items: center; font-weight: 700; font-size: 13px; line-height: 22px; color: #ffc14d; font-variant-numeric: tabular-nums; }
  .golpe .carga { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: #0f1320; }
  .golpe .carga i { display: block; height: 100%; background: #ffc14d; }

  .selo { position: relative; display: inline-flex; width: 22px; height: 22px; border-radius: 4.5px; align-items: center; justify-content: center; flex: none; }
  .selo svg { width: 17px; height: 17px; display: block; }
  .cat { position: absolute; right: -4px; bottom: -4px; width: 12px; height: 12px; border-radius: 3.4px; background: #fff; border: 1.5px solid #2b3347; display: flex; align-items: center; justify-content: center; }
  .cat svg { width: 8px; height: 8px; }

  .time { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  .tile { position: relative; height: 48px; border-radius: 12px; background: #2b3347; box-shadow: 0 4px 0 #0f1320; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; overflow: hidden; }
  .tile.ativo { box-shadow: inset 0 0 0 2px #ffc14d, 0 4px 0 #0f1320; }
  .tile .mini { width: 24px; height: 4px; border-radius: 2px; background: #5fd17f; display: block; }
  .tile .mini.vazio { background: #0f1320; overflow: hidden; }
  .tile .mini.vazio i { display: block; height: 100%; width: 40%; background: #ffc14d; }
  .marca { position: absolute; top: 4px; right: 4px; width: 14px; height: 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .marca svg { width: 8px; height: 8px; display: block; }

  .taticas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .btn { height: 40px; border-radius: 12px; background: #3a4458; box-shadow: 0 4px 0 #262d3d; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; line-height: 12px; letter-spacing: 0.5px; text-transform: uppercase; color: #fff; }
  .btn.ativo { background: #ffc14d; box-shadow: 0 4px 0 #c48f1f; color: #171c2c; }
  .legenda { height: 12px; display: flex; align-items: center; font-weight: 500; font-size: 11px; line-height: 12px; color: #9aa5bd; }
  .legenda b { font-weight: 600; color: #fff; margin-left: 4px; }

  /* cards do Lab de Golpes (1b Relógio) dentro da régua chapada */
  .lg { position: relative; overflow: hidden; height: 72px; padding: 12px; border-radius: 12px; background: #20233a; color: #fff; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 0 0 2px rgba(255,255,255,.06), 0 4px 0 #0f1320; }
  .lg .fundo { position: absolute; inset: 0; }
  .lg .dim { position: absolute; inset: 0; background: rgba(8,9,16,.55); }
  .lg .r1 { position: relative; height: 20px; display: flex; align-items: center; gap: 8px; }
  .lg .n { flex: 1; min-width: 0; font-size: 13.5px; line-height: 20px; font-weight: 700; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lg .pw { flex: none; font-size: 20px; line-height: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .lg .r2 { position: relative; height: 22px; display: flex; align-items: center; gap: 4px; }
  .lg .ic { position: relative; flex: none; width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .lg .ic.claro { background: #eef1f6; }
  .lg .ic svg { display: block; }
  .lg .sweep { position: absolute; inset: 0; border-radius: 6px; }
  .lg .esp { flex: 1; }
  .lg .cd, .lg .cast { flex: none; display: flex; align-items: center; gap: 3px; font-size: 13px; line-height: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .lg .cast { color: rgba(255,255,255,.8); margin-left: 4px; }
  .lg .cd svg, .lg .cast svg { width: 10px; height: 10px; display: block; }
</style>
</head>
<body>
<div class="tela">
  <div class="campo">
    <img src="img/campo-pixel.png" alt="">
    <div class="hud">
      <div class="quadrado"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></div>
      <div class="placa">
        <span class="retrato"><span class="sp" style="width: 40px; height: 40px; background-image: url('img/sagitario.png'); background-size: 2340px 60px; background-position: -790px -22px"></span></span>
        <span class="info">
          <span class="l1"><span class="nome">Sagitário</span><span class="coracoes">
            <svg viewBox="0 0 24 24"><path d="M12 21s-8.5-5.2-8.5-11.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8.5 2.5C20.5 15.8 12 21 12 21z" fill="#ff5f6d"/></svg>
            <svg viewBox="0 0 24 24"><path d="M12 21s-8.5-5.2-8.5-11.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8.5 2.5C20.5 15.8 12 21 12 21z" fill="#ff5f6d"/></svg>
            <svg viewBox="0 0 24 24"><path d="M12 21s-8.5-5.2-8.5-11.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8.5 2.5C20.5 15.8 12 21 12 21z" fill="#ff5f6d"/></svg>
            <svg viewBox="0 0 24 24"><path d="M12 21s-8.5-5.2-8.5-11.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8.5 2.5C20.5 15.8 12 21 12 21z" fill="#ff5f6d"/></svg>
            <svg viewBox="0 0 24 24"><path d="M12 21s-8.5-5.2-8.5-11.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8.5 2.5C20.5 15.8 12 21 12 21z" fill="#ff5f6d"/></svg>
            <svg viewBox="0 0 24 24"><path d="M12 21s-8.5-5.2-8.5-11.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8.5 2.5C20.5 15.8 12 21 12 21z" fill="#3a4458"/></svg>
          </span></span>
          <span class="l2"><span class="barra"><i style="width: 69%"></i></span><span class="num">72/105</span></span>
        </span>
      </div>
    </div>
  </div>

  <div class="baixo">
<div class="placa" style="flex: none; height: 48px; padding-left: 6px">
      <span class="retrato" style="width: 36px; height: 36px; border-radius: 8px"><span class="sp" style="width: 36px; height: 36px; background-image: url('img/aries.png'); background-size: 2340px 60px; background-position: -12px -24px"></span></span>
      <span class="info">
        <span class="l1"><span class="nome">Áries</span><span class="selo" style="width: 16px; height: 16px; border-radius: 3.25px; background: #ef6a3a"><svg style="width: 12px; height: 12px" viewBox="0 0 24 24"><path d="M12 2c.6 3.4 3 5.2 4.6 7.4A7 7 0 1 1 5 14c0-2.4 1.2-4.4 2.8-5.8.2 1.8 1 3 2.2 3.6C9.6 8.2 10.4 5 12 2z" fill="#fff"/></svg></span></span>
        <span class="l2"><span class="barra"><i style="width: 80%"></i></span><span class="num">84/105</span></span>
      </span>
    </div>
    <div class="divisor"></div>
    <div class="bloco">
      <div class="rotulo"><span>Seu time · 6/6</span></div>
      <div class="time">
        <div class="tile ativo"><span class="sp" style="width: 32px; height: 32px; background-image: url('img/aries.png'); background-size: 2340px 60px; background-position: -14px -26px"></span><span class="mini"></span></div>
        <div class="tile"><img src="img/gotinha.png" style="width: 28px; height: 28px; image-rendering: pixelated; display: block"><span class="mini"></span><span class="marca" style="background: #5fd17f"><svg viewBox="0 0 24 24" fill="none" stroke="#171c2c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4M5 11l7-7 7 7"/></svg></span></div>
        <div class="tile"><span class="sp" style="width: 32px; height: 32px; background-image: url('img/briserecs.png'); background-size: 780px 60px; background-position: -14px -26px"></span><span class="mini"></span></div>
        <div class="tile"><img src="img/brotinho.png" style="width: 28px; height: 28px; image-rendering: pixelated; display: block"><span class="mini"></span><span class="marca" style="background: #ff5f6d"><svg viewBox="0 0 24 24" fill="none" stroke="#171c2c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M5 13l7 7 7-7"/></svg></span></div>
        <div class="tile"><img src="img/faisca.png" style="width: 28px; height: 28px; image-rendering: pixelated; display: block"><span class="mini vazio"><i></i></span></div>
        <div class="tile"><img src="img/pedrisco.png" style="width: 28px; height: 28px; image-rendering: pixelated; display: block"><span class="mini"></span></div>
      </div>
    </div>
    <div class="divisor"></div>
    <div class="bloco">
            <div class="taticas"><div class="btn ativo">Avançar</div><div class="btn">Distância</div><div class="btn">Firme</div><div class="btn">Esquivar</div></div>
    </div>
    <div class="divisor"></div>
    <div class="golpes">
      <div class="lg">
        <span class="fundo" style="background: radial-gradient(95% 130% at 8% 115%, #ffc15a 0%, #f2702e 28%, #b8301f 58%, #3a0f12 100%)"></span>
        <span class="r1"><span class="n">Rastro Ardente</span><span class="pw">30</span></span>
        <span class="r2"><span class="ic"><svg width="22" height="22" viewBox="0 0 32 32"><rect width="32" height="32" rx="6.5" fill="#ef6a3a"/><g transform="translate(6.5 6.5) scale(.7917)"><path d="M12 2c.6 3.4 3 5.2 4.6 7.4A7 7 0 1 1 5 14c0-2.4 1.2-4.4 2.8-5.8.2 1.8 1 3 2.2 3.6C9.6 8.2 10.4 5 12 2z" fill="#fff"/></g></svg></span><span class="ic claro"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1a1c2c" stroke-width="3.2" stroke-linecap="round"><path d="M8 3C7 8 5.5 12 3 16M14 3c-1 6-2.5 11-5.5 16M20 3c-1 5-2.5 9-5 13"/></svg></span><span class="ic claro"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 9.6a2.4 2.4 0 1 1 0 4.8 2.4 2.4 0 0 1 0-4.8z" fill="#1a1c2c"/><path d="M12 3.5a8.5 8.5 0 1 1 0 17 8.5 8.5 0 0 1 0-17z" fill="none" stroke="#1a1c2c" stroke-width="2.6"/></svg></span><span class="esp"></span><span class="cd" style="color: #fff"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7M20.5 3.5v4.5H16"/></svg>5.0s</span></span>
      </div>
      <div class="lg">
        <span class="fundo" style="background: radial-gradient(95% 130% at 8% 115%, #ffc15a 0%, #f2702e 28%, #b8301f 58%, #3a0f12 100%)"></span>
        <span class="r1"><span class="n">Pira</span><span class="pw">35</span></span>
        <span class="r2"><span class="ic"><svg width="22" height="22" viewBox="0 0 32 32"><rect width="32" height="32" rx="6.5" fill="#ef6a3a"/><g transform="translate(6.5 6.5) scale(.7917)"><path d="M12 2c.6 3.4 3 5.2 4.6 7.4A7 7 0 1 1 5 14c0-2.4 1.2-4.4 2.8-5.8.2 1.8 1 3 2.2 3.6C9.6 8.2 10.4 5 12 2z" fill="#fff"/></g></svg></span><span class="ic claro"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1a1c2c" stroke-width="3.2" stroke-linecap="round"><path d="M8 3C7 8 5.5 12 3 16M14 3c-1 6-2.5 11-5.5 16M20 3c-1 5-2.5 9-5 13"/></svg></span><span class="ic claro"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1a1c2c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5 19 5V3.5h-1.5L3 18M7 13.5l3.5 3.5M3.5 20.5l2-2"/></svg></span><span class="esp"></span><span class="cd" style="color: #fff"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7M20.5 3.5v4.5H16"/></svg>6.0s</span></span>
      </div>
      <div class="lg">
        <span class="fundo" style="background: radial-gradient(95% 130% at 8% 115%, #ffc15a 0%, #f2702e 28%, #b8301f 58%, #3a0f12 100%)"></span><span class="dim"></span>
        <span class="r1"><span class="n">Detonação</span><span class="pw">75</span></span>
        <span class="r2"><span class="ic"><svg width="22" height="22" viewBox="0 0 32 32"><rect width="32" height="32" rx="6.5" fill="#ef6a3a"/><g transform="translate(6.5 6.5) scale(.7917)"><path d="M12 2c.6 3.4 3 5.2 4.6 7.4A7 7 0 1 1 5 14c0-2.4 1.2-4.4 2.8-5.8.2 1.8 1 3 2.2 3.6C9.6 8.2 10.4 5 12 2z" fill="#fff"/></g></svg><span class="sweep" style="background: conic-gradient(rgba(8,9,16,.78) 198deg, transparent 0)"></span></span><span class="ic claro"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M16.5 7.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z" fill="#1a1c2c"/><path d="M2 12h8M4 7.5h6.5M4 16.5h6.5" fill="none" stroke="#1a1c2c" stroke-width="2.6" stroke-linecap="round"/></svg></span><span class="ic claro"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 9.6a2.4 2.4 0 1 1 0 4.8 2.4 2.4 0 0 1 0-4.8z" fill="#1a1c2c"/><path d="M12 3.5a8.5 8.5 0 1 1 0 17 8.5 8.5 0 0 1 0-17z" fill="none" stroke="#1a1c2c" stroke-width="2.6"/></svg></span><span class="esp"></span><span class="cd" style="color: #ffcd75"><svg viewBox="0 0 24 24" fill="none" stroke="#ffcd75" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7M20.5 3.5v4.5H16"/></svg>4.1s</span></span>
      </div>
      <div class="lg">
        <span class="fundo" style="background: radial-gradient(95% 130% at 8% 115%, #ffc15a 0%, #f2702e 28%, #b8301f 58%, #3a0f12 100%)"></span>
        <span class="r1"><span class="n">Muralha de Fogo</span><span class="pw" style="font-size: 14px; letter-spacing: 1px">DEF</span></span>
        <span class="r2"><span class="ic"><svg width="22" height="22" viewBox="0 0 32 32"><rect width="32" height="32" rx="6.5" fill="#ef6a3a"/><g transform="translate(6.5 6.5) scale(.7917)"><path d="M12 2c.6 3.4 3 5.2 4.6 7.4A7 7 0 1 1 5 14c0-2.4 1.2-4.4 2.8-5.8.2 1.8 1 3 2.2 3.6C9.6 8.2 10.4 5 12 2z" fill="#fff"/></g></svg></span><span class="ic claro"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V15L12 7.5 3 15zM3 18.5 12 11l9 7.5V23L12 15.5 3 23z" fill="#1a1c2c"/></svg></span><span class="ic claro"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 9.6a2.4 2.4 0 1 1 0 4.8 2.4 2.4 0 0 1 0-4.8z" fill="#1a1c2c"/><path d="M12 3.5a8.5 8.5 0 1 1 0 17 8.5 8.5 0 0 1 0-17z" fill="none" stroke="#1a1c2c" stroke-width="2.6"/></svg></span><span class="esp"></span><span class="cd" style="color: #fff"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7M20.5 3.5v4.5H16"/></svg>8.0s</span></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
