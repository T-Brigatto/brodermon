<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;800&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0c0d16}
a{color:#ffcd75}a:hover{color:#f4f4f4}
</style>
</helmet>
<div style="min-height: 100vh; background: #0c0d16; color: #f4f4f4; font-family: 'Rubik', sans-serif">
  <main style="max-width: 1080px; margin: 0 auto; padding: 48px 24px 80px; display: flex; flex-direction: column; gap: 48px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 28px; line-height: 32px; font-weight: 800">Ícones de tipo e categoria</span>
      <span style="font-size: 15px; line-height: 20px; color: #94b0c2">Tipos em quadrado arredondado (5a) · categorias garras, projétil e chevrons (6b) · SVGs em icones/</span>
    </div>

    <section data-screen-label="Tipos" style="display: flex; flex-direction: column; gap: 20px">
      <span style="font-size: 13px; line-height: 13px; font-weight: 800; letter-spacing: 1px; color: #94b0c2">TIPOS</span>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="10">
          <div style="padding: 20px 16px; background: #141625; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 14px">
            <span style="width: 72px; height: 72px; border-radius: 14px; background: {{t.c}}; display: flex; align-items: center; justify-content: center"><img src="{{t.src}}" alt="" style="width: 38px; height: 38px"></span>
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="width: 22px; height: 22px; border-radius: 5px; background: {{t.c}}; display: flex; align-items: center; justify-content: center"><img src="{{t.src}}" alt="" style="width: 14px; height: 14px"></span>
              <span style="width: 16px; height: 16px; border-radius: 4px; background: {{t.c}}; display: flex; align-items: center; justify-content: center"><img src="{{t.src}}" alt="" style="width: 10px; height: 10px"></span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
              <span style="font-size: 15px; line-height: 15px; font-weight: 600">{{t.name}}</span>
              <span style="font-size: 12px; line-height: 12px; color: #566c86">{{t.c}} · ícone {{t.ink}}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </section>

    <section data-screen-label="Categorias" style="display: flex; flex-direction: column; gap: 20px">
      <span style="font-size: 13px; line-height: 13px; font-weight: 800; letter-spacing: 1px; color: #94b0c2">CATEGORIAS</span>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="3">
          <div style="padding: 20px; background: #141625; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 14px">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="width: 64px; height: 64px; border-radius: 13px; background: #e9ecf2; display: flex; align-items: center; justify-content: center"><img src="{{c.dark}}" alt="" style="width: 34px; height: 34px"></span>
              <span style="width: 64px; height: 64px; border-radius: 13px; background: #2a2f4a; display: flex; align-items: center; justify-content: center"><img src="{{c.light}}" alt="" style="width: 34px; height: 34px"></span>
              <span style="width: 18px; height: 18px; border-radius: 5px; background: #e9ecf2; display: flex; align-items: center; justify-content: center"><img src="{{c.dark}}" alt="" style="width: 12px; height: 12px"></span>
            </div>
            <span style="font-size: 15px; line-height: 15px; font-weight: 600">{{c.name}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  build() {
    if (this._b) return this._b;
    var svg = function (f, s, color, sw) {
      var b = '';
      if (f) b += '<path d="' + f + '" fill="' + color + '" fill-rule="evenodd"/>';
      if (s) b += '<path d="' + s + '" fill="none" stroke="' + color + '" stroke-width="' + (sw || 2.4) + '" stroke-linecap="round" stroke-linejoin="round"/>';
      return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' + b + '</svg>');
    };
    var DK = '#14243a', W = '#ffffff';
    var T = [
      ['Fogo', '#ef6a3a', W, 'M12 2c.6 3.4 3 5.2 4.6 7.4A7 7 0 1 1 5 14c0-2.4 1.2-4.4 2.8-5.8.2 1.8 1 3 2.2 3.6C9.6 8.2 10.4 5 12 2z', ''],
      ['Água', '#2f8cf0', W, 'M12 2.5c3.3 4.3 6.5 8 6.5 12a6.5 6.5 0 0 1-13 0c0-4 3.2-7.7 6.5-12z', ''],
      ['Ar', '#4cc9d8', DK, '', 'M3 9h11a3 3 0 1 0-3-3M3 13h15a3 3 0 1 1-3 3M3 17h6'],
      ['Terra', '#b9773f', W, 'M1.5 20 8.5 8l4 6.5 2.5-4L22.5 20z', ''],
      ['Eletricidade', '#f2c230', DK, 'M13.5 2 4.5 13.5h6.5L9.5 22l10-12.5h-6.5z', ''],
      ['Natureza', '#3fae5a', W, 'M20.5 3.5C11 3.5 4.5 8.5 4.5 15.5c0 1.7.4 3.3 1 4.5C8 13 12 10 16 8.5 12.5 11 9.5 14.5 7.5 20.5c1 .3 2 .5 3 .5 7 0 10-6.5 10-17.5z', ''],
      ['Mineral', '#8a9bb0', W, 'M10 2l6 6.5L10 22 4 8.5zM18.5 9l3 3.5-3 6.5-2.2-5.5z', ''],
      ['Arcano', '#9b5bd6', W, 'M11 2c.9 5.4 3.6 8.1 9 9-5.4.9-8.1 3.6-9 9-.9-5.4-3.6-8.1-9-9 5.4-.9 8.1-3.6 9-9zM19 15.5c.35 1.9 1.1 2.65 3 3-1.9.35-2.65 1.1-3 3-.35-1.9-1.1-2.65-3-3 1.9-.35 2.65-1.1 3-3z', ''],
      ['Primordial', '#c23b55', W, '', 'M13 11.5a1 1 0 0 1 1 1 2 2 0 0 1-2 2 3 3 0 0 1-3-3 4 4 0 0 1 4-4 5 5 0 0 1 5 5 6 6 0 0 1-6 6 7 7 0 0 1-7-7 8 8 0 0 1 8-8'],
      ['Gelo', '#7fc8ec', DK, '', 'M12 2v20M3.3 7l17.4 10M3.3 17l17.4-10M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5M3 10.5l3.4-.9.9-3.4M21 13.5l-3.4.9-.9 3.4M3 13.5l3.4.9.9 3.4M21 10.5l-3.4-.9-.9-3.4']
    ];
    var C = [
      ['Físico', '', 'M8 3C7 8 5.5 12 3 16M14 3c-1 6-2.5 11-5.5 16M20 3c-1 5-2.5 9-5 13', 3.2],
      ['Mágico', 'M16.5 7.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9z', 'M2 12h8M4 7.5h6.5M4 16.5h6.5', 2.6],
      ['Especial', 'M3 10.5 12 3l9 7.5V15L12 7.5 3 15zM3 18.5 12 11l9 7.5V23L12 15.5 3 23z', '']
    ];
    this._b = {
      types: T.map(function (t) { return { name: t[0], c: t[1], ink: t[2], src: svg(t[3], t[4], t[2]) }; }),
      cats: C.map(function (c) { return { name: c[0], dark: svg(c[1], c[2], '#1a1c2c', c[3]), light: svg(c[1], c[2], '#f4f4f4', c[3]) }; })
    };
    return this._b;
  }
  renderVals() { return this.build(); }
}
</script>
</body>
</html>
